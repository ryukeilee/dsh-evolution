<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
body{font-family:var(--font-sans,system-ui);color:var(--foreground);margin:0}select{font:inherit;color:var(--foreground);background:var(--secondary);border:1px solid var(--border);border-radius:6px;padding:5px 8px}.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.legend{font-size:12px;color:var(--muted-foreground);margin:10px 0}.dot{display:inline-block;width:9px;height:9px;margin-right:4px;border-radius:2px}.row{display:grid;grid-template-columns:70px 1fr;gap:8px;margin:13px 0;align-items:center}.label{font-size:13px}.lane{display:grid;grid-template-columns:1fr 66px;gap:8px;align-items:center;height:19px}.bar{height:11px;border-radius:3px;min-width:2px}.value{font-family:var(--font-mono,monospace);font-size:12px;text-align:right}.note{font-size:12px;color:var(--muted-foreground);line-height:1.5;margin:10px 0 0}</style>
<div class="controls"><select id="scenario" aria-label="场景"><option value="cold">首次冷吸收</option><option value="incremental">已有历史后吸收 2,000 条</option></select><select id="metric" aria-label="指标"><option value="wallMs">墙钟 ms</option><option value="cpuMs">CPU ms</option></select></div>
<div class="legend"><span class="dot" style="background:var(--chart-1)"></span>main 6b4dee9　<span class="dot" style="background:var(--chart-2)"></span>最终候选 a04de4f · 三轮中位数</div><div id="chart" role="img" aria-label="基线与最终候选耗时比较"></div><p class="note">每个样本为独立进程、真实官方存储后端。条数为冷吸收规模或已有历史规模。RSS 代价与全部原始样本见性能报告。</p><script>const data=[{"scenario":"cold","n":2000,"a":{"wallMs":380.948,"cpuMs":411.238},"b":{"wallMs":240.02462500000001,"cpuMs":255.269}},{"scenario":"cold","n":12000,"a":{"wallMs":2057.857083,"cpuMs":2184.964},"b":{"wallMs":1265.276417,"cpuMs":1347.03}},{"scenario":"cold","n":20000,"a":{"wallMs":3454.697709,"cpuMs":3796.709},"b":{"wallMs":2091.486416,"cpuMs":2312.628}},{"scenario":"incremental","n":2000,"a":{"wallMs":1412.564167,"cpuMs":1466.374},"b":{"wallMs":308.235125,"cpuMs":337.014}},{"scenario":"incremental","n":12000,"a":{"wallMs":4456.359042,"cpuMs":4638.06},"b":{"wallMs":438.07950000000005,"cpuMs":482.229}},{"scenario":"incremental","n":20000,"a":{"wallMs":7279.330416999999,"cpuMs":7561.523},"b":{"wallMs":502.55083399999967,"cpuMs":552.33}}];const scenario=document.querySelector('#scenario'),metric=document.querySelector('#metric');function draw(){const rows=data.filter(r=>r.scenario===scenario.value),key=metric.value,max=Math.max(...rows.map(r=>r.a[key]));document.querySelector('#chart').innerHTML=rows.map(r=>'<div class="row"><div class="label">'+r.n.toLocaleString()+' 条</div><div>'+['a','b'].map((side,i)=>'<div class="lane"><div><div class="bar" style="width:'+(r[side][key]/max*100)+'%;background:var(--chart-'+(i+1)+')"></div></div><div class="value">'+r[side][key].toFixed(1)+'</div></div>').join('')+'</div></div>').join('')}scenario.onchange=metric.onchange=draw;draw();</script></html>
