name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NPM_CONFIG_FUND: 'false'
  NPM_CONFIG_AUDIT: 'false'

jobs:
  test:
    name: unit tests (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The declared engine range: the lowest supported 22.x and the current
        # 24.x line. --ignore-scripts skips native builds the unit suite does
        # not need; the host acceptance job installs the real host separately.
        node: ['22.19.0', '24.x']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install from the lockfile
        run: npm ci --ignore-scripts
      - name: Unit tests
        run: npm test

  package:
    name: package (clean, pinned, installable)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.19.0'
          cache: npm
      - name: Package checks (byte stability, allow-list, canonical modes, pin)
        run: npm run pack:check
      - name: Verify the committed release artifact against the pin
        run: npm run release:verify
      - name: Build a local artifact and prove it has the pinned content
        # The local build is compressed by this runner's npm, so its bytes are
        # allowed to differ from the published ones; its content is not.
        run: |
          set -euo pipefail
          npm run release:pack
          node scripts/release/verify-artifact.mjs dist/dsh-evolution-*.tgz --content-only
      - name: Start the doctor from the published tarball with no host installed
        run: |
          set -euo pipefail
          tarball="$(ls release/*.tgz)"
          mkdir -p /tmp/clean-install /tmp/clean-home
          tar -xzf "$tarball" -C /tmp/clean-install
          # The doctor entry point must run with no host packages present: the
          # bundle is unpacked without any node_modules, so a reintroduced host
          # import fails here instead of only in a real install.
          #
          # Exit codes are 0 healthy / 1 degraded / 2 blocked. A home that has
          # never been started is legitimately `degraded` (data.root is created
          # on first run), so only a `blocked` check is a failure here.
          set +e
          node /tmp/clean-install/package/scripts/doctor.mjs --home /tmp/clean-home --no-composition --json > /tmp/clean-report.json
          code=$?
          set -e
          echo "doctor exit code: $code"
          node -e "
          const report = require('/tmp/clean-report.json');
          if (typeof report.status !== 'string') throw new Error('the doctor produced no status');
          const blocked = report.checks.filter((c) => c.level === 'blocked').map((c) => c.id);
          console.log('doctor status:', report.status, '| blocked checks:', blocked.length ? blocked.join(', ') : 'none');
          if (blocked.length > 0) throw new Error('the doctor reports a blocked install: ' + blocked.join(', '));
          "
          if [ "$code" -gt 1 ]; then echo "the doctor exited $code" >&2; exit 1; fi
      - name: Verify the checksum file attached to the release
        run: cd release && sha256sum --check SHA256SUMS
      - name: Upload the artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dsh-evolution-package
          path: |
            release/*.tgz
            release/SHA256SUMS
            release/manifest.json
            dist/manifest.json
          if-no-files-found: error

  host-acceptance:
    name: host acceptance (${{ matrix.host }})
    needs: [package]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # One entry per host release this bundle declares as supported. A
        # version may only appear here (and in peerDependencies) after this job
        # passes on it.
        host: ['0.2.0-rc.2', '0.2.1-alpha.1']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.19.0'
          cache: npm
      - uses: pnpm/action-setup@v6
        with:
          version: 11.26.0
      - name: Build the artifact this job installs
        run: |
          set -euo pipefail
          npm run release:pack
          node scripts/release/verify-artifact.mjs dist/dsh-evolution-*.tgz --content-only
      - name: Real install acceptance on DSH ${{ matrix.host }}
        run: |
          node scripts/acceptance/run-host-acceptance.mjs \
            --host "${{ matrix.host }}" \
            --out "docs/evidence/dsh-${{ matrix.host }}.json"
      - name: Prove the recorded evidence describes the pinned content
        run: |
          node -e "
          const evidence = require('./docs/evidence/dsh-${{ matrix.host }}.json');
          const pin = require('./release/manifest.json');
          if (evidence.ok !== true) throw new Error('the acceptance did not pass');
          if (evidence.contentSha256 !== pin.contentSha256) {
            throw new Error('evidence content ' + evidence.contentSha256 + ' !== pin ' + pin.contentSha256);
          }
          console.log('evidence matches pinned content', pin.contentSha256);
          "
      - name: Upload the acceptance evidence
        uses: actions/upload-artifact@v7
        with:
          name: acceptance-${{ matrix.host }}
          path: docs/evidence/dsh-${{ matrix.host }}.json
          if-no-files-found: error
