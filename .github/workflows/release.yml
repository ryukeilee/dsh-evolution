name: Release artifacts

# Verifies the tagged commit against the pinned artifact and attaches that exact
# artifact to a DRAFT GitHub release. Nothing is published automatically: a human
# publishes the draft. This repository is never published to npm.
#
# The tarball is not rebuilt here on purpose. `npm pack` compresses through the
# runner's bundled zlib, so a build made here would have different bytes from
# the one the acceptance ran against. The released bytes are committed under
# `release/` and verified instead.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build artifacts for
        required: true

permissions:
  contents: write

jobs:
  release:
    name: verify and attach release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
      - name: Verify the tag matches the package version
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version="${tag#v}"
          actual="$(node -p "require('./package.json').version")"
          if [ "$version" != "$actual" ]; then
            echo "tag $tag does not match package.json version $actual" >&2
            exit 1
          fi
      - name: Verify the package and the pinned artifact
        run: |
          set -euo pipefail
          npm run pack:check
          npm run release:verify
      - name: Attach the verified artifacts to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --draft --generate-notes --title "dsh-evolution $tag"
          gh release upload "$tag" release/dsh-evolution-*.tgz release/SHA256SUMS release/manifest.json --clobber
